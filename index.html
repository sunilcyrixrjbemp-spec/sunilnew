<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyrix Healthcare - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           CYRIX HEALTHCARE — MASTER VARIABLES
        ============================================================ */
        :root {
            --primary: #1e40af;
            --primary-dark: #002b5e; /* Exact deep navy */
            --primary-light: #3b82f6;
            --primary-50: #eff6ff;
            --accent: #10b981;
            --danger: #ef4444;
            --danger-light: #fee2e2;
            
            --bg: #f8fafc;
            --surface: #ffffff;
            --surface-2: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --text-2: #475569;
            --text-3: #94a3b8;
            
            --shadow-xs: 0 1px 2px rgba(15,23,42,0.05);
            --shadow-sm: 0 1px 3px rgba(15,23,42,0.08);
            --shadow-md: 0 4px 16px rgba(15,23,42,0.1);
            --shadow-lg: 0 8px 32px rgba(15,23,42,0.12);
            
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --t-fast: 0.15s ease;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: var(--font); }
        
        body { 
            background-color: var(--bg); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            padding: 20px; 
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }

        .login-card { 
            background: var(--surface); 
            padding: 48px 40px; 
            border-radius: 24px; 
            box-shadow: var(--shadow-lg); 
            width: 100%; 
            max-width: 420px; 
            position: relative; 
            border: 1px solid var(--border);
        }

        .header-text { 
            text-align: center; 
            margin-bottom: 32px; 
        }

        /* PERFECTLY CENTERED LOGO */
        .cyrix-img { 
            height: 60px; 
            display: block;
            margin: 0 auto 20px auto; /* Auto margin on L/R centers it */
        }

        h1 { 
            font-size: 26px; 
            font-weight: 800;
            color: var(--primary-dark); 
            margin-bottom: 6px; 
            letter-spacing: -0.5px;
        }

        p { 
            font-size: 14px; 
            color: var(--text-2); 
            font-weight: 500;
        }

        .form-group { 
            margin-bottom: 20px; 
        }

        .form-group label { 
            display: block; 
            font-size: 11px; 
            font-weight: 700; 
            color: var(--text-3); 
            margin-bottom: 8px; 
            text-transform: uppercase; 
            letter-spacing: 0.5px;
        }

        .form-group input { 
            width: 100%; 
            padding: 14px 16px; 
            border: 1.5px solid var(--border); 
            border-radius: 12px; 
            font-size: 14px; 
            font-weight: 500;
            color: var(--text);
            background: var(--surface);
            outline: none; 
            transition: all var(--t-fast);
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(30,64,175,0.1);
        }

        .password-wrapper { 
            position: relative; 
        }

        .toggle-text-btn { 
            position: absolute; 
            right: 14px; 
            top: 50%; 
            transform: translateY(-50%); 
            background: none; 
            border: none; 
            color: var(--primary-light); 
            font-size: 12px; 
            font-weight: 700; 
            cursor: pointer; 
            transition: color var(--t-fast);
        }
        .toggle-text-btn:hover {
            color: var(--primary-dark);
        }

        .submit-btn { 
            background: var(--primary); 
            color: white; 
            border: none; 
            padding: 16px; 
            border-radius: 12px; 
            width: 100%; 
            font-weight: 700; 
            font-size: 15px;
            cursor: pointer; 
            transition: all var(--t-fast); 
            margin-top: 10px; 
            box-shadow: var(--shadow-sm);
        }

        .submit-btn:hover:not(:disabled) { 
            background: var(--primary-dark); 
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .submit-btn:disabled { 
            background: var(--text-3); 
            cursor: not-allowed; 
            box-shadow: none;
            transform: none;
        }

        .form-footer { 
            text-align: center; 
            margin-top: 28px; 
            font-size: 13px; 
        }

        .form-footer a { 
            color: var(--primary-light); 
            text-decoration: none; 
            font-weight: 600; 
            transition: color var(--t-fast);
        }
        .form-footer a:hover {
            color: var(--primary-dark);
        }

        .divider { 
            margin: 0 12px; 
            color: var(--border); 
        }

        footer { 
            margin-top: 36px; 
            text-align: center; 
            font-size: 12px; 
            color: var(--text-3); 
            font-weight: 500;
        }
        
        footer a {
            color: var(--primary-light);
            text-decoration: none;
            font-weight: 700;
            transition: color var(--t-fast);
        }
        footer a:hover {
            color: var(--primary-dark);
        }

        /* Error Popup Styling synced with standard modals */
        .custom-popup { 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%); 
            background: var(--surface); 
            padding: 32px; 
            border-radius: 20px; 
            box-shadow: var(--shadow-lg); 
            z-index: 10000; 
            text-align: center; 
            display: none; 
            width: 90%; 
            max-width: 360px; 
            animation: popIn 0.3s cubic-bezier(0.4,0,0.2,1); 
            border: 1px solid var(--border);
        }

        @keyframes popIn { 
            from { transform: translate(-50%, -40%) scale(0.95); opacity: 0; } 
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; } 
        }

        .popup-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: rgba(15,23,42,0.5); 
            backdrop-filter: blur(4px);
            z-index: 9999; 
            display: none; 
        }

        .error-icon-wrapper {
            width: 60px;
            height: 60px;
            background: var(--danger-light);
            color: var(--danger);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        @media (max-width: 480px) {
            .login-card { padding: 32px 24px; }
            h1 { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="popup-overlay" id="overlay"></div>
    <div class="custom-popup" id="errorPopup">
        <div class="error-icon-wrapper">
            <svg width="32" height="32" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <h3 id="popupMsg" style="color: var(--primary-dark); font-size: 16px; margin-bottom: 24px; font-weight: 700; line-height: 1.4;"></h3>
        <button class="submit-btn" onclick="closePopup()" style="margin: 0;">OK, Got it</button>
    </div>

    <div class="login-card">
        <div class="header-text">
            <img src="logo.png" alt="Cyrix Logo" class="cyrix-img" onerror="this.style.display='none';">
            <h1>Cyrix Healthcare</h1>
            <p>Field Data Management</p>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label>User ID</label>
                <input type="text" id="username" placeholder="Enter your User ID" required autocomplete="username">
            </div>

            <div class="form-group">
                <label>Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    <button type="button" id="toggleBtn" class="toggle-text-btn">Show</button>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="loginBtn">Login to Dashboard</button>

            <div class="form-footer">
                <a href="/retrieve">Get Your User ID</a>
                <span class="divider">|</span>
                <a href="/reset">Account Help</a>
            </div>
        </form>

        <footer>
            <p>&copy; Designed & Developed by <a href="https://sunilbishnoi.co.in" target="_blank" rel="noopener noreferrer">Sunil Bishnoi</a></p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('logged_in_user_id')) {
                window.location.href = 'home.html';
            }

            const toggleBtn = document.getElementById('toggleBtn');
            const passwordInput = document.getElementById('password');

            toggleBtn.addEventListener('click', () => {
                if (passwordInput.type === 'password') {
                    passwordInput.type = 'text';
                    toggleBtn.textContent = 'Hide';
                } else {
                    passwordInput.type = 'password';
                    toggleBtn.textContent = 'Show';
                }
            });
        });

        function showError(t) {
            document.getElementById('popupMsg').innerText = t;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('errorPopup').style.display = 'block';
        }

        function closePopup() {
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('errorPopup').style.display = 'none';
        }

        const loginForm = document.getElementById('loginForm');
        const loginBtn = document.getElementById('loginBtn');

        loginForm.addEventListener('submit', async function (event) {
            event.preventDefault();
            
            const originalBtnText = loginBtn.innerHTML;
            loginBtn.innerHTML = '<svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24" style="animation:spin 1s linear infinite; display:inline-block; vertical-align:middle; margin-right:8px;"><path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/></svg> Verifying...';
            loginBtn.disabled = true;

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        user_id: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    localStorage.clear();
                    localStorage.setItem('logged_in_user_id', data.user_id);
                    localStorage.setItem('display_name', data.full_name);
                    localStorage.setItem('user_role', data.role);
                    window.location.href = 'home.html';
                } else {
                    showError(data.message);
                    loginBtn.innerHTML = originalBtnText;
                    loginBtn.disabled = false;
                }
            } catch (err) {
                showError("Server Connection Failed. Please try again.");
                loginBtn.innerHTML = originalBtnText;
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
